<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script>
/* Apply the saved theme before the page paints, so it never flashes the wrong colours */
(function(){var p='system';try{p=localStorage.getItem('kala_theme')||'system'}catch(e){}
var d=p==='dark'||(p==='system'&&!(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches));
document.documentElement.setAttribute('data-theme',d?'dark':'light')})();
</script>
<style>
/* Kala — Ink #1E2A3B, Amber #F5A524 (the running minute hand), White.
   Type: SF Pro Rounded on Apple devices, echoing the rounded strokes of the logo. */
:root{--bg:#121A26;--card:#1C2636;--card2:#27344A;--tx:#F4F6F9;--mut:#9AA8BA;--line:#2C3A50;--ok:#4ADE80;--bad:#FF7A70;--amber:#F5A524;--ink:#1E2A3B;--hi:#F5A524;
--leaveBg:#F4F6F9;--leaveTx:#1E2A3B;--track:#2C3A50;--face:#F4F6F9;--scrim:rgba(5,9,15,.55);--sheet:#1C2636;color-scheme:dark;
--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F2F4F7;--card:#FFFFFF;--card2:#ECEFF4;--tx:#1E2A3B;--mut:#5C6B80;--line:#E3E7ED;--ok:#15803D;--bad:#C81E1E;--hi:#9A5B00;
--leaveBg:#1E2A3B;--leaveTx:#FFFFFF;--track:#E3E7ED;--face:#1E2A3B;--scrim:rgba(30,42,59,.35);--sheet:#FFFFFF;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;height:100%}
html,body{background:var(--bg)}
body{margin:0;min-height:100%;color:var(--tx);font:17px/1.3 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;touch-action:manipulation}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.wrapA{max-width:520px;margin:0 auto;padding:calc(var(--safeT) + 10px) 16px calc(var(--safeB) + 12px)}

/* ---------- Main screen: one page, no scrolling ---------- */
#main{display:none;flex-direction:column;min-height:calc(100dvh - var(--safeT) - var(--safeB) - 22px)}
.hd{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.hd>div{flex:1;min-width:0}
.hd h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{display:block;color:var(--mut);font-size:15px;margin-top:2px}
#warn{color:var(--bad)}
#warn:not(:empty)::before{content:" · ";color:var(--mut)}
.icoBtn{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:none;color:var(--mut);display:grid;place-items:center;margin-right:-8px}
.icoBtn:active{background:var(--card)}
.icoBtn svg{width:24px;height:24px}

/* Hero: the week as a clock face. The amber hand and arc travel toward 45 hours. */
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:24px;padding:16px 18px}
.dial{flex:none;width:104px;height:104px}
.dial .trk{stroke:var(--track)}
.dial .arc{stroke:var(--face);transition:stroke-dashoffset .6s ease}
/* the white strokes stay dimmed until the week reaches 45 h; then the dial becomes the Kala mark */
.dial .k{fill:var(--face);opacity:.38;transition:opacity .4s ease}
.dial .arc{opacity:.85}
.dial.full .k,.dial.full .arc{opacity:1}
#hand{transition:transform .6s ease}
@media (prefers-reduced-motion:reduce){.dial .arc,#hand{transition:none}}
.hero .tx{min-width:0}
#hrs{display:block;font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.05}
#goal{display:block;color:var(--mut);font-size:15px;margin-top:3px}
#bal{display:inline-block;margin-top:10px;font-size:15px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card2)}
.pos{color:var(--ok)}.neg{color:var(--bad)}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
.btns button{border:0;border-radius:16px;min-height:58px;padding:0 8px;font-size:19px;font-weight:600;line-height:1.15;transition:transform .1s}
.btns button small{display:block;font-size:13px;font-weight:500;opacity:.75;margin-top:1px}
#bS{background:var(--amber);color:var(--ink)}#bB{background:var(--leaveBg);color:var(--leaveTx)}
.btns button:active{transform:scale(.97)}

.wk{display:flex;align-items:center;justify-content:space-between}
.wk>button.ar{width:44px;height:44px;border:0;border-radius:22px;background:none;color:var(--hi);font-size:26px;line-height:1}
.wk>button.ar:active{background:var(--card)}
#wkB{border:0;background:none;text-align:center;min-height:44px;padding:2px 14px;border-radius:12px}
#wkB:active{background:var(--card)}
#wkB b{display:block;font-size:17px;font-weight:600}
#wkB small{display:block;color:var(--mut);font-size:13px}
#wkB small::after{content:" ▾";font-size:10px}

.list{display:flex;flex-direction:column;background:var(--card);border-radius:20px;padding:2px 12px;margin-top:4px}
.day{display:grid;grid-template-columns:40px 1fr 50px 1fr 46px;align-items:center;column-gap:4px;min-height:54px;flex:1;max-height:66px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dn{border:0;background:none;padding:0;text-align:left;line-height:1.1}
.dn b{display:block;font-size:15px;font-weight:600}
.dn i{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:1px}
.day.today .dn b{color:var(--hi)}
.ch{border:0;border-radius:10px;background:var(--card2);min-height:36px;padding:0 2px;font-size:14px;white-space:nowrap}
.ch.e{color:var(--mut)}
.mid{text-align:center;color:var(--mut);line-height:1.1}
.mid span{display:block;font-size:13px}
.mid small{display:block;font-size:11px;margin-top:2px;white-space:nowrap}
.mid.fri small{color:var(--hi);font-weight:600}
.bl{text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.bl.e{color:var(--mut);font-weight:400}
.lv{grid-column:2/5;border:0;border-radius:10px;min-height:36px;background:var(--card2);font-size:14px;font-weight:600;color:var(--hi)}

#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 18px);transform:translate(-50%,20px);max-width:calc(100% - 32px);background:var(--tx);color:var(--bg);font-size:15px;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Pull down to refresh ---------- */
#ptr{position:fixed;left:0;right:0;top:calc(var(--safeT) - 56px);display:flex;justify-content:center;z-index:10;pointer-events:none;opacity:0}
#ptr.back{transition:transform .25s ease,opacity .25s ease}
body.ptrback .wrapA{transition:transform .25s ease}
#ptr svg{width:44px;height:44px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
#hM{transform-origin:118.16px 128px}
#ptr.spin #hM{animation:spinM .8s linear infinite}
@keyframes spinM{to{transform:rotate(360deg)}}

/* ---------- Sheets (bottom) ---------- */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s;z-index:25}
#scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--sheet);border-radius:22px 22px 0 0;padding:8px 16px calc(var(--safeB) + 16px);z-index:30;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.shTop{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;min-height:44px;margin-bottom:10px}
.shTop b{text-align:center;font-size:17px;font-weight:600}
.shTop button{border:0;background:none;min-height:44px;font-size:17px;color:var(--hi);padding:0}
.shTop button:first-child{text-align:left;color:var(--mut)}
.shTop button:last-child{text-align:right;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;min-height:38px;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink);font-weight:600}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.fld{border:2px solid transparent;border-radius:14px;background:var(--card2);padding:8px 0;text-align:center}
.fld small{display:block;color:var(--mut);font-size:13px}
.fld b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.fld[aria-pressed="true"]{border-color:var(--amber)}
.wheels{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;height:180px;overflow:hidden;border-radius:14px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;border-radius:10px;background:var(--card2);pointer-events:none}
.wheels::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--sheet),transparent 32%,transparent 68%,var(--sheet))}
.wh{position:relative;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;text-align:center;overscroll-behavior:contain}
.wh::-webkit-scrollbar{display:none}
.wh .pad{height:72px}
.wh .it{height:36px;line-height:36px;font-size:22px;scroll-snap-align:center;cursor:pointer}
#dsReset{display:block;margin:10px auto 0;border:0;background:none;color:var(--bad);font-size:16px;min-height:44px;padding:0 16px}
#dsLeave{text-align:center;color:var(--mut);font-size:16px;padding:34px 0 30px}
#dsLeave b{display:block;color:var(--tx);font-size:22px;margin-bottom:4px}

/* Calendar */
.calH,.calR{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.calH{color:var(--mut);font-size:13px;margin-bottom:4px}
.calR{width:100%;border:0;background:none;border-radius:12px;padding:0;min-height:44px;align-items:center}
.calR.sel{background:var(--card2)}
.calR span{position:relative;font-size:16px;line-height:32px}
.calR span.o{color:var(--mut);opacity:.5}
.calR span.t{color:var(--hi);font-weight:700}
.calR span.d::after{content:"";position:absolute;left:50%;bottom:-1px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--amber)}
#cToday{display:block;margin:10px auto 0;border:0;background:none;color:var(--hi);font-size:16px;font-weight:600;min-height:44px;padding:0 16px}

/* ---------- Settings: slides in from the right ---------- */
#set{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
#set.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open,#set,#set.open,#scrim{transition:none}}
.setTop{display:flex;align-items:center;gap:4px;min-height:44px;margin:0 0 6px -10px}
#setX{border:0;background:none;color:var(--hi);font-size:17px;min-height:44px;padding:0 10px;display:flex;align-items:center;gap:4px}
#setX svg{width:12px;height:20px}
#set h2{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:0 0 4px}
.sec{margin-top:22px}
.sec h3{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 8px 4px}
.grp{background:var(--card);border-radius:14px;overflow:hidden}
#set .seg{background:var(--card);padding:4px}
#set .seg button{min-height:42px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:0 16px;border:0;background:none;text-align:left;font-size:17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .val{color:var(--mut);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.row:active{background:var(--card2)}
.row.danger{color:var(--bad);justify-content:center;font-weight:500}
.imp{padding:14px 16px}
.imp p{color:var(--mut);font-size:14px;margin:0 0 10px}
.imp textarea{display:block;width:100%;min-height:84px;border:0;border-radius:12px;background:var(--card2);color:var(--tx);padding:10px 12px;font:16px/1.4 ui-monospace,Menlo,monospace}
.imp button{width:100%;margin:10px 0 0;border:0;border-radius:12px;min-height:46px;font-weight:600;background:var(--amber);color:var(--ink)}
#impM{min-height:18px;font-size:14px;color:var(--mut);padding-top:8px;text-align:center}

/* ---------- Sign in ---------- */
#auth{display:none;padding-top:8vh}
#auth .brand{display:block;width:180px;height:auto;margin:0 auto 10px;color:var(--tx)}
#auth .tagline{text-align:center;color:var(--mut);font-size:16px;margin:0 0 26px}
#auth .box{background:var(--card);border-radius:22px;padding:20px}
#auth h2{font-size:22px;margin:0 0 14px}
#auth input{display:block;width:100%;margin:0 0 10px;padding:13px 14px;border-radius:12px;border:0;background:var(--card2);color:var(--tx);font-size:17px;font-family:inherit}
#auth input::placeholder{color:var(--mut)}
#auth input:focus{outline:2px solid var(--hi);outline-offset:0}
#auth .ab{display:grid;gap:10px;margin-top:6px}
#auth .ab button{border:0;border-radius:14px;min-height:50px;font-size:17px;font-weight:600;color:var(--ink);background:var(--amber)}
#auth .ab button#aUp{background:none;color:var(--hi);min-height:44px}
#aM{color:var(--mut);font-size:14px;min-height:18px;margin-top:8px;text-align:center}
#authLang{display:block;margin:18px auto 0;border:0;background:none;color:var(--mut);font-size:15px;font-weight:500;min-height:44px;padding:0 12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<p class="tagline" data-t="tagline"></p>

<button type="button" id="authLang"></button>
</div>

<div id="main">
<div class="hd">

</div>

<div class="hero">
<svg class="dial" id="dial" viewBox="30 30 196 196" aria-hidden="true">
<circle class="trk" cx="128" cy="128" r="82" fill="none" stroke-width="20"/>
<circle class="arc" id="arc" cx="128" cy="128" r="82" fill="none" stroke-width="20" stroke-linecap="round" transform="rotate(-90 128 128)" stroke-dasharray="515.2" stroke-dashoffset="515.2"/>
<rect class="k" x="107.66" y="63.38" width="129.24" height="21" rx="10.5" transform="rotate(90 118.16 73.88)"/>

</svg>

</div>

<div class="wk"><button type="button" class="ar" id="prev">‹</button><button type="button" id="wkB"><b id="wk"></b><small id="wkL"></small></button><button type="button" class="ar" id="next">›</button></div>

<div class="list" id="rows"></div>
</div>
</div>

<div id="scrim"></div>

<!-- Day editor -->
<div class="sheet" id="ds" role="dialog" aria-modal="true" aria-labelledby="dsT">
<div class="grab"></div>
<div class="shTop"><button type="button" id="dsX" data-t="cancel"></button><b id="dsT"></b><button type="button" id="dsOk" data-t="done"></button></div>

function retry(){if(!retryT)retryT=setTimeout(function(){retryT=null;flush()},5000)}
/* One row per day: saving a day only ever touches that day,
   so an old tab or another phone can never wipe other days. */
function writeDay(k){
 if(!sb||!uid||busy[k])return;
 busy[k]=true;
 var ver=pend[k],e=S.days[k],q;
 if(e&&(e.type||e.in||e.out))q=sb.from('work_days').upsert({user_id:uid,day:k,in_time:e.type?e.type.toUpperCase():(e.in||null),out_time:e.type?null:(e.out||null),updated_at:new Date().toISOString()},{onConflict:'user_id,day'});
 else q=sb.from('work_days').delete().eq('user_id',uid).eq('day',k);
 q.then(function(res){
  busy[k]=false;
  if(res.error){sy('retrying');retry();return}
  if(pend[k]===ver){delete pend[k];cache()}else if(pend[k]){writeDay(k);return}
  allSaved();
 },function(){busy[k]=false;sy('offlineSave');retry()});
}
function flush(){for(var k in pend)writeDay(k)}
function saveDay(k){
 var e=S.days[k];
 if(e){if(e.type){S.days[k]={type:e.type}}else{if(!e.in)delete e.in;if(!e.out)delete e.out;delete e.type;if(!e.in&&!e.out)delete S.days[k]}}
 pend[k]=(pend[k]||0)+1;cache();
 writeDay(k);
}

   var x={},it=(r.in_time||'').trim();

   else{if(it)x.in=it.slice(0,5);if(r.out_time)x.out=r.out_time.slice(0,5)}
   if(x.type||x.in||x.out)srv[r.day]=x});

 },function(){loading=false;sy('offlineCopy')});

/* ===== Time helpers ===== */
function pad(n){return(n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd8(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
var view=monday(new Date()),curDay=ds(new Date());
function tm(s){if(!s)return null;var p=s.split(':');return +p[0]*60+ +p[1]}
function h12(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),n=m%60;return (h%12||12)+':'+pad(n)+' '+(h<12?'AM':'PM')}
function hm(m){var a=Math.round(m),h=Math.floor(a/60),n=a%60;return h+t('h')+(n?' '+pad(n)+t('m'):'')}
function dS(m){var a=Math.abs(Math.round(m));if(a===0)return '0'+t('m');var h=Math.floor(a/60),n=a%60;return (m<0?'−':'+')+(h?h+t('h')+(n?' '+pad(n)+t('m'):''):n+t('m'))}
function cls(m){return m>0?'pos':(m<0?'neg':'')}
function dshort(d){return d.getDate()+' '+t('months')[d.getMonth()]}

/* ===== Week maths =====
   Each work day is 9 h. MC and AL count as 9 h. Friday suggests a leave time that brings the
   week to exactly 0; once Friday's leave is recorded it counts like any other day. */
function weekCalc(mon){
 var tot=0,hrs=0,rec=null;
 for(var i=0;i<7;i++){
  var d=new Date(mon);d.setDate(mon.getDate()+i);var e=S.days[ds(d)]||{};
  if(e.type){hrs+=STD;continue}
  var a=tm(e.in),o=tm(e.out);
  if(i===4&&a!==null&&o===null)rec=a+STD-tot;
  if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;hrs+=w;tot+=w-STD}
 }
 return {tot:tot,hrs:hrs,rec:rec};
}

/* ===== Render ===== */
function chip(k,f,v){return '<button type="button" class="ch'+(v?'':' e')+'" data-k="'+k+'" data-f="'+f+'">'+(v?h12(tm(v)):'--:--')+'</button>'}
function render(){
 var html='',td=ds(new Date()),c=weekCalc(view),DAYS=t('days');
 for(var i=0;i<7;i++){
  var d=new Date(view);d.setDate(view.getDate()+i);var k=ds(d),e=S.days[k]||{};
  if(i>4&&!e.in&&!e.out&&!e.type&&k!==td)continue;
  var dn='<button type="button" class="dn" data-k="'+k+'" data-f="in"><b>'+DAYS[i]+'</b><i>'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</i></button>';
  if(e.type){
   html+='<div class="day'+(k===td?' today':'')+'">'+dn+'<button type="button" class="lv" data-k="'+k+'" data-f="in">'+t(e.type)+'</button><div class="bl e">9'+t('h')+'</div></div>';
   continue;
  }
  var a=tm(e.in),o=tm(e.out),bal='—',bc=' e',mid='',fri=false;
  if(i===4&&a!==null&&o===null&&c.rec!==null){mid=h12(c.rec);fri=true}
  else if(a!==null)mid=h12(a+STD);
  if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;bal=dS(w-STD);bc=' '+cls(w-STD)}
  html+='<div class="day'+(k===td?' today':'')+'">'+dn+chip(k,'in',e.in)
  +'<div class="mid'+(fri?' fri':'')+'"><span aria-hidden="true">→</span>'+(mid?'<small>'+mid+'</small>':'')+'</div>'
  +chip(k,'out',e.out)+'<div class="bl'+bc+'">'+bal+'</div></div>';
 }
 $('rows').innerHTML=html;
 /* hero */
 var p=Math.max(0,Math.min(1,c.hrs/GOAL));
 $('arc').setAttribute('stroke-dashoffset',(515.2*(1-p)).toFixed(1));$('arc').setAttribute('stroke-linecap',p>=1?'butt':'round');$('dial').classList.toggle('full',p>=1);
 /* the amber hand travels from 12 o'clock to its place in the logo (pointing to 4:30) */
 $('hand').style.transform='rotate('+(p*135)+'deg)';
 $('hrs').textContent=hm(c.hrs);
 $('goal').textContent=t('ofGoal',{g:hm(GOAL)});
 var b=$('bal');b.textContent=dS(c.tot)+' '+t('balanceSfx');b.className=cls(c.tot);
 /* week label */
 var end=new Date(view);end.setDate(view.getDate()+4);
 $('wk').textContent=view.getMonth()===end.getMonth()?view.getDate()+' – '+dshort(end):dshort(view)+' – '+dshort(end);
 var off=Math.round((view-monday(new Date()))/604800000);
 $('wkL').textContent=off===0?t('thisWeek'):off===-1?t('lastWeek'):off===1?t('nextWeek'):view.getFullYear();

}

function toast(s){var m=$('toast');m.textContent=s;m.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){m.classList.remove('on')},2600)}
function mark(f){
 var n=new Date(),k=ds(n);S.days[k]=S.days[k]||{};
 view=monday(n);
 if(S.days[k].type){delete S.days[k].type}
 if(f==='in'&&S.days[k].in){render();toast(t('already',{t:h12(tm(S.days[k].in))}));return}
 S.days[k][f]=pad(n.getHours())+':'+pad(n.getMinutes());
 saveDay(k);render();
 var tt=h12(tm(S.days[k][f]));
 toast(f==='in'?t('arrivalRec',{t:tt}):(S.days[k].in?t('leaveRec',{t:tt}):t('noArrival',{t:tt})));
}
function tick(){var k=ds(new Date());if(k!==curDay){curDay=k;view=monday(new Date());render();greet()}}

$('prev').onclick=function(){view.setDate(view.getDate()-7);render()};
$('next').onclick=function(){view.setDate(view.getDate()+7);render()};
$('rows').addEventListener('click',function(ev){var b=ev.target.closest('[data-k]');if(b)openDay(b.getAttribute('data-k'),b.getAttribute('data-f')||'in')});

/* ===== Sheets ===== */
var openSheet=null;
function showSheet(el){closeSheets(true);openSheet=el;el.classList.add('open');$('scrim').classList.add('on');document.body.classList.add('lock')}
function closeSheets(keepScrim){if(openSheet){openSheet.classList.remove('open');openSheet=null}if(!keepScrim){$('scrim').classList.remove('on');if(!$('set').classList.contains('open'))document.body.classList.remove('lock')}}
$('scrim').onclick=function(){closeSheets()};

/* Day editor with our own time wheels: nothing is saved until Done, and a half-spun
   wheel can never clear a time. Reset clears the selected time on purpose. */
var IT=36,HRS=[],MINS=[],draft=null,dKey=null,dField='in';
for(var i=1;i<=12;i++)HRS.push(i);for(i=0;i<60;i++)MINS.push(pad(i));
function buildWheel(el,items){el.innerHTML='<div class="pad"></div>'+items.map(function(x){return '<div class="it">'+x+'</div>'}).join('')+'<div class="pad"></div>'}
buildWheel($('wH'),HRS);buildWheel($('wM'),MINS);buildWheel($('wP'),['AM','PM']);
/* The chosen time lives here, one part per wheel. A wheel only changes its own part,
   and only after a finger has touched it — so a wheel that iOS failed to position
   can never quietly change the hour or AM/PM. */
var WV={h:12,m:0,p:0},WMAX={wH:11,wM:59,wP:1},WIDX={wH:0,wM:0,wP:0};
function wIdx(el){return Math.max(0,Math.min(WMAX[el.id],Math.round(el.scrollTop/IT)))}
function place(){
 ['wH','wM','wP'].forEach(function(id){
  var el=$(id);if(el._user)return;
  el.style.scrollSnapType='none';el.scrollTop=WIDX[id]*IT;void el.offsetHeight;el.style.scrollSnapType='';
 });
}
function setWheels(v){
 var m=tm(v),h=Math.floor(m/60),n=m%60;
 WV={h:h%12||12,m:n,p:h<12?0:1};WIDX={wH:WV.h-1,wM:n,wP:WV.p};
 ['wH','wM','wP'].forEach(function(id){$(id)._user=false});
 /* iOS ignores scroll positions set while the sheet is still sliding in, so set them now and again once it has settled */
 place();requestAnimationFrame(place);setTimeout(place,120);setTimeout(place,380);
}
function wvTime(){return pad((WV.h%12)+(WV.p?12:0))+':'+pad(WV.m)}
['wH','wM','wP'].forEach(function(id){
 var el=$(id);
 function touched(){el._user=true}
 el.addEventListener('touchstart',touched,{passive:true});el.addEventListener('pointerdown',touched);el.addEventListener('wheel',touched,{passive:true});
 el.addEventListener('scroll',function(){
  if(!el._user)return;
  clearTimeout(el._t);
  el._t=setTimeout(function(){
   if(!draft)return;var i=wIdx(el);
   if(id==='wH')WV.h=i+1;else if(id==='wM')WV.m=i;else WV.p=i;
   draft[dField]=wvTime();dsFields();
  },110);
 },{passive:true});
 el.addEventListener('click',function(e){var it=e.target.closest('.it');if(!it)return;touched();var idx=Array.prototype.indexOf.call(el.querySelectorAll('.it'),it);el.scrollTo({top:idx*IT,behavior:'smooth'})});
});
function dsFields(){
 $('fIn').textContent=draft.in?h12(tm(draft.in)):'--:--';
 $('fOut').textContent=draft.out?h12(tm(draft.out)):'--:--';
 var f=document.querySelectorAll('.fld');for(var i=0;i<f.length;i++)f[i].setAttribute('aria-pressed',f[i].getAttribute('data-f')===dField?'true':'false');
 $('dsReset').textContent=t(dField==='in'?'resetIn':'resetOut');
 $('dsReset').style.visibility=draft[dField]?'visible':'hidden';
 segSel('dsType',draft.type||'');
 $('dsWork').hidden=!!draft.type;$('dsLeave').hidden=!draft.type;
 if(draft.type)$('dsLeaveT').textContent=t(draft.type);
}
function h24(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function selField(f){
 dField=f;
 var v=draft[f];
 if(!v){var d=pd8(dKey),rec=d.getDay()===5?weekCalc(monday(d)).rec:null;v=f==='in'?'08:00':(rec!==null&&draft.in?h24(rec):(draft.in?h24(tm(draft.in)+STD):'17:00'))}
 setWheels(v);dsFields();
}
function openDay(k,f){
 dKey=k;var e=S.days[k]||{};draft={in:e.in||'',out:e.out||'',type:e.type||''};
 $('dsT').textContent=pd8(k).toLocaleDateString(t('locale'),{weekday:'long',day:'numeric',month:'short'});
 dField=f||'in';dsFields();showSheet($('ds'));
 setTimeout(function(){if(!draft.type)selField(dField)},30);
}
document.querySelectorAll('.fld').forEach(function(b){b.onclick=function(){selField(b.getAttribute('data-f'))}});
$('dsType').onclick=function(e){var b=e.target.closest('button');if(!b)return;draft.type=b.getAttribute('data-v');dsFields();if(!draft.type)setTimeout(function(){selField(dField)},30)};
$('dsReset').onclick=function(){draft[dField]='';dsFields()};
$('dsX').onclick=function(){closeSheets()};
$('dsOk').onclick=function(){
 var k=dKey,old=JSON.stringify(S.days[k]||{});
 S.days[k]=draft.type?{type:draft.type}:{in:draft.in,out:draft.out};
 saveDay(k);closeSheets();render();
 if(old!==JSON.stringify(S.days[k]||{}))toast(t('saved'));
};

/* Calendar: tap the week to jump to any week */
var calM=null;
function openCal(){calM=new Date(view.getFullYear(),view.getMonth(),1);drawCal();showSheet($('cs'))}
function drawCal(){
 $('cT').textContent=t('monthsL')[calM.getMonth()]+' '+calM.getFullYear();
 $('cH').innerHTML=t('days').map(function(x){return '<span>'+x+'</span>'}).join('');
 var start=monday(calM),last=new Date(calM.getFullYear(),calM.getMonth()+1,0),html='',td=ds(new Date()),sel=ds(view);
 for(var w=new Date(start);w<=last;w.setDate(w.getDate()+7)){
  var k=ds(w);html+='<button type="button" class="calR'+(k===sel?' sel':'')+'" data-w="'+k+'">';
  for(var i=0;i<7;i++){var d=new Date(w);d.setDate(w.getDate()+i);var dk=ds(d);
   html+='<span class="'+(d.getMonth()!==calM.getMonth()?'o ':'')+(dk===td?'t ':'')+(S.days[dk]?'d':'')+'">'+d.getDate()+'</span>'}
  html+='</button>';
 }
 $('cG').innerHTML=html;
}
$('wkB').onclick=openCal;
$('cPrev').onclick=function(){calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);drawCal()};
$('cNext').onclick=function(){calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);drawCal()};
$('cG').onclick=function(e){var b=e.target.closest('[data-w]');if(!b)return;view=pd8(b.getAttribute('data-w'));closeSheets();render()};
$('cToday').onclick=function(){view=monday(new Date());closeSheets();render()};

/* ===== Settings panel (slides in from the right) ===== */
function openSet(){closeSheets();acct();$('impM').textContent='';$('set').scrollTop=0;$('set').classList.add('open');document.body.classList.add('lock');setTimeout(function(){$('setX').focus()},60)}
function closeSet(){if(!$('set').classList.contains('open'))return;$('set').classList.remove('open');document.body.classList.remove('lock');$('gear').focus()}
$('gear').onclick=openSet;$('setX').onclick=closeSet;
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(openSheet)closeSheets();else closeSet()}});
$('segL').onclick=function(e){var b=e.target.closest('button');if(b)setLang(b.getAttribute('data-v'))};
$('segT').onclick=function(e){var b=e.target.closest('button');if(b)setTheme(b.getAttribute('data-v'))};
$('authLang').onclick=function(){setLang(LANG==='ms'?'en':'ms')};
/* swipe right from the left edge to go back, like iOS */
(function(){var sx=null,sy0=0,el=$('set');
 el.addEventListener('touchstart',function(e){var x=e.touches[0].clientX;sx=x<28?x:null;sy0=e.touches[0].clientY},{passive:true});
 el.addEventListener('touchend',function(e){if(sx===null)return;var c=e.changedTouches[0];if(c.clientX-sx>70&&Math.abs(c.clientY-sy0)<60)closeSet();sx=null});
})();

/* ===== No zooming on iPhone (pinch); double-tap zoom is off via touch-action ===== */
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('gesturechange',function(e){e.preventDefault()});

/* ===== Pull down to refresh ===== */
var ptr=$('ptr'),hM=$('hM'),wrapA=$('wrapA'),y0=null,pdist=0,busyR=false,TRIG=70;
function ptrSet(d){wrapA.style.transform=d?'translateY('+d+'px)':'';ptr.style.transform='translateY('+d+'px)';ptr.style.opacity=Math.min(1,d/40);hM.style.transform='rotate('+(d*5)+'deg)'}
function hardReload(){location.replace(location.pathname+'?r='+Date.now())}
document.addEventListener('touchstart',function(e){
 if(busyR||window.scrollY>0||e.touches.length!==1||openSheet||$('set').classList.contains('open')||$('main').style.display==='none')return;
 y0=e.touches[0].clientY;pdist=0;ptr.classList.remove('back');document.body.classList.remove('ptrback');
},{passive:true});
document.addEventListener('touchmove',function(e){
 if(y0===null)return;
 var d=e.touches[0].clientY-y0;
 if(d<=0||window.scrollY>0){if(pdist){pdist=0;ptrSet(0)}return}
 pdist=Math.min(110,d*.55);ptrSet(pdist);
 if(e.cancelable)e.preventDefault();
},{passive:false});
document.addEventListener('touchend',function(){
 if(y0===null)return;y0=null;
 ptr.classList.add('back');document.body.classList.add('ptrback');
 if(pdist>=TRIG){
  busyR=true;ptrSet(TRIG);ptr.classList.add('spin');
  setTimeout(function(){if(navigator.onLine===false){busyR=false;ptr.classList.remove('spin');ptrSet(0);sy('offlineCopy')}else hardReload()},450);
 }else ptrSet(0);
 pdist=0;
});
if(/[?&]r=\d+/.test(location.search)&&history.replaceState)history.replaceState(null,'',location.pathname);

/* ===== Automatic update: reload when a newer version is published ===== */
var APPV='20261127182344';
function checkUpdate(){
 if(!/^\d+$/.test(APPV)||!window.fetch||openSheet)return;
 fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(x){
  var m=x.match(/var APPV='(\d+)'/);
  if(m&&m[1]>APPV&&!Object.keys(pend).length)hardReload();
 }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){greet();checkUpdate()}});
setTimeout(checkUpdate,3000);

/* ===== Import from the old Work Hours app ===== */
function importData(txt){
 var o;try{o=JSON.parse(txt)}catch(e){return t('badData')}
 var d=(o&&o.days)||o;if(!d||typeof d!=='object')return t('noDays');
 var n=0,re=/^([01]?\d|2[0-3]):[0-5]\d$/;
 for(var k in d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
  var v=d[k]||{},x=S.days[k]||{},ch=false;
  if(x.type)continue;
  if(re.test(v.in||'')&&!x.in){x.in=v.in.length===4?'0'+v.in:v.in;ch=true}
  if(re.test(v.out||'')&&!x.out){x.out=v.out.length===4?'0'+v.out:v.out;ch=true}
  if(ch){S.days[k]=x;saveDay(k);n++}
 }
 render();
 return n?t('imported',{n:n}):t('nothingNew');
}
$('impB').onclick=function(){var v=$('impT').value.trim();if(!v){$('impM').textContent=t('pasteFirst');return}$('impM').textContent=importData(v);$('impT').value=''};

/* Import handed over by the bookmarklet on the old app (kala…/#import=<data>).
   The data stays on this device until the user is signed in and the server copy has loaded. */
(function(){
 var h=location.hash;
 if(h.indexOf('#import=')===0){
  try{localStorage.setItem('kala_pending_import',decodeURIComponent(h.slice(8)))}catch(e){}
  if(history.replaceState)history.replaceState(null,'',location.pathname);
 }
})();
function runPendingImport(){
 var v=ls('kala_pending_import');if(!v||!uid)return;
 try{localStorage.removeItem('kala_pending_import')}catch(e){}
 toast(importData(v));
}

applyTheme();applyLang();
setupAuth();
</script>
