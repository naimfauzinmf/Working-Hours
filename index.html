<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0c">
<title>Work Hours Tracker</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--mut:#98989f;--line:#38383a;--ok:#32d74b;--bad:#ff6961;--sam:#1f9d55;--bal:#d93b40;--hi:#0a84ff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;max-width:520px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
.hd{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.hd h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.4px;line-height:1.1}
.hd small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.lg{position:relative;flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;overflow:hidden;
background:radial-gradient(circle at 22% 18%,#fff 0,rgba(255,255,255,0) 48%),radial-gradient(circle at 85% 90%,#9a9aa3 0,rgba(154,154,163,0) 60%),linear-gradient(145deg,#e4e4e8,#74747c);
box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.28),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -10px 18px rgba(0,0,0,.18)}
.lg::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:46%;border-radius:9px 9px 30px 30px/9px 9px 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.06))}
.lg svg{position:relative;z-index:1}
.lg svg{width:30px;height:30px}
/* Summary: the one big number */
.sum{background:var(--card);border-radius:20px;padding:20px 20px 18px;margin-bottom:12px}
.sum small{color:var(--mut);font-size:15px;font-weight:500;display:block}
.sum b{font-size:44px;font-weight:700;letter-spacing:-1px;display:block;margin:2px 0 6px;line-height:1.1}
.sum span{color:var(--mut);font-size:15px}
.sum span b{display:inline;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:0;margin:0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* Arrive / Leave */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button{border:0;border-radius:16px;padding:0;font-size:19px;font-weight:600;color:#fff;min-height:64px;transition:transform .1s,opacity .1s}
.btns button small{display:block;font-size:13px;font-weight:500;margin-top:2px}
#bS{background:var(--sam)}#bB{background:var(--bal)}
.btns button:active{transform:scale(.97);opacity:.85}
#bB:disabled{background:var(--card);color:var(--tx);border:1px dashed var(--line);cursor:default;transform:none;opacity:1}
#bB:disabled small{color:var(--mut)}
#msg{min-height:18px;text-align:center;color:var(--mut);font-size:14px;margin:8px 0 4px}
/* Week switcher */
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.nav button{background:none;border:0;color:var(--hi);width:44px;height:44px;border-radius:22px;font-size:26px;line-height:1}
.nav button:active{background:var(--card)}
.nav div{text-align:center}
.nav b{display:block;font-size:17px;font-weight:600}
.nav small{display:block;color:var(--mut);font-size:13px;min-height:16px}
/* Day list */
.wrap{background:var(--card);border-radius:20px;padding:0 14px}
.day{display:grid;grid-template-columns:46px 1fr 72px;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dn{grid-row:1/3;line-height:1.15}
.dn b{display:block;font-size:17px;font-weight:600}
.dn i{display:block;font-style:normal;color:var(--mut);font-size:13px}
.day.today .dn b{color:var(--hi)}
.tm{display:flex;align-items:center;gap:6px}
.tm>span{color:var(--mut);font-size:13px;flex:none}
.tg{grid-column:2;color:var(--mut);font-size:13px;margin-top:5px;padding-left:2px}
.bl{grid-row:1/3;grid-column:3;text-align:right;font-weight:600;font-size:15px}
.bl.e{color:var(--mut);font-weight:400}
.tc{position:relative;flex:1;min-width:0;display:block;text-align:center;padding:9px 2px;background:var(--card2);border-radius:10px;font-size:15px;line-height:1.2;white-space:nowrap}
.tc.e{color:var(--mut)}
.tc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.tc.rec{background:transparent;border:1px dashed #636366;padding:3px 2px}
.tc.rec em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:1px}
.x{position:absolute;top:-12px;right:-12px;width:30px;height:30px;z-index:2;padding:0;border:0;background:transparent;font-size:0}
.x::after{content:"×";position:absolute;top:7px;right:7px;width:15px;height:15px;border-radius:50%;background:#3a3a3c;color:#c7c7cc;font-size:12px;line-height:15px;text-align:center}
/* Footer: sync + account */
.ft{margin-top:22px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6}
.ft button{background:none;border:0;color:var(--hi);font-size:13px;padding:6px 8px}
/* Sign in */
#auth{display:none;background:var(--card);border-radius:20px;padding:20px;margin-top:4px}
#auth h2{font-size:22px;margin:0 0 4px}
#auth p{color:var(--mut);font-size:15px;margin:0 0 16px}
#auth input{display:block;width:100%;margin:0 0 10px;padding:13px 14px;border-radius:12px;border:0;background:var(--card2);color:var(--tx);font-size:17px}
#auth input:focus{outline:2px solid var(--hi);outline-offset:0}
#auth .ab{display:grid;gap:10px;margin-top:6px}
#auth button{border:0;border-radius:14px;min-height:50px;font-size:17px;font-weight:600;color:#fff;background:var(--sam)}
#auth button#aUp{background:none;color:var(--hi);min-height:44px}
#aM{color:var(--mut);font-size:14px;min-height:18px;margin-top:8px;text-align:center}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.btns button{transition:none}.btns button:active{transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="hd">
<div class="lg"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16" fill="rgba(255,255,255,.3)" stroke="#0b0b0c" stroke-width="3"/><path d="M24 14v10l7 4.5" fill="none" stroke="#0b0b0c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="2.2" fill="#0b0b0c"/></svg></div>
<div><h1>Work Hours</h1><small id="syT"></small></div>
</div>
<div id="auth"><h2>Sign in</h2><p>Your times are saved to your account and show on every device.</p><input id="aE" type="email" autocomplete="email" placeholder="Email"><input id="aP" type="password" autocomplete="current-password" placeholder="Password"><div class="ab"><button type="button" id="aIn">Sign In</button><button type="button" id="aUp">Create Account</button></div><div id="aM" role="status"></div></div>
<div id="main" style="display:none">

<div class="sum"><small>This week’s balance</small><b id="tot">0 min</b><span><b id="hrs">0 hr</b> worked</span></div>

<div class="btns"><button type="button" id="bS">Arrive</button><button type="button" id="bB">Leave</button></div>
<div id="msg" role="status"></div>

<div class="nav"><button type="button" id="prev" aria-label="Previous week">‹</button><div><b id="wk"></b><small id="wkL"></small></div><button type="button" id="next" aria-label="Next week">›</button></div>

<div class="wrap" id="rows"></div>

<div class="ft"><span id="who"></span><br><button type="button" id="out">Sign Out</button></div>

</div>
<script>
/* ===== Settings: paste your own Supabase values here ===== */
var SUPABASE_URL='https://qiugsuydkxppbcxxexxv.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_yYvjJwn99QNyZLkYI5PGjQ_yjWfUUVf';
/* ========================================================= */
var started=false,STD=540,S={days:{}},pend={},uid=null,sb=null,busy={},retryT=null;
var CONFIGURED=/^https:\/\//.test(SUPABASE_URL)&&SUPABASE_ANON_KEY.length>20&&window.supabase;
function $(i){return document.getElementById(i)}
function sy(t){var e=$('syT');if(e)e.textContent=t}
function ck(){return 'wh_'+(uid||'local')}
function cache(){try{localStorage.setItem(ck(),JSON.stringify({days:S.days,pend:pend}))}catch(e){}}
function loadCache(){S.days={};pend={};try{var o=JSON.parse(localStorage.getItem(ck())||'null');if(o){S.days=o.days||{};pend=o.pend||{}}}catch(e){}}
function allSaved(){if(!Object.keys(pend).length)sy('✓ Synced')}
function retry(){if(!retryT)retryT=setTimeout(function(){retryT=null;flush()},5000)}
/* One row per day: saving a day only ever touches that day,
   so an old tab or another phone can never wipe other days. */
function writeDay(k){
 if(!sb||!uid||busy[k])return;
 busy[k]=true;
 var ver=pend[k],e=S.days[k],q;
 if(e&&(e.in||e.out))q=sb.from('work_days').upsert({user_id:uid,day:k,in_time:e.in||null,out_time:e.out||null,updated_at:new Date().toISOString()},{onConflict:'user_id,day'});
 else q=sb.from('work_days').delete().eq('user_id',uid).eq('day',k);
 q.then(function(res){
  busy[k]=false;
  if(res.error){sy('⚠ Not synced yet — retrying');retry();return}
  if(pend[k]===ver){delete pend[k];cache()}else if(pend[k]){writeDay(k);return}
  allSaved();
 },function(){busy[k]=false;sy('⚠ Offline — will save when back');retry()});
}
function flush(){for(var k in pend)writeDay(k)}
function saveDay(k){
 var e=S.days[k];if(e){if(!e.in)delete e.in;if(!e.out)delete e.out;if(!e.in&&!e.out)delete S.days[k]}
 pend[k]=(pend[k]||0)+1;cache();
 if(sb&&uid)sy('Saving…');
 writeDay(k);
}
/* Fetch from the server every time the app is opened or comes back to the front */
var loading=false;
function pull(){
 if(!sb||!uid||loading)return;loading=true;
 sb.from('work_days').select('day,in_time,out_time').then(function(res){
  loading=false;
  if(res.error){sy('⚠ Could not load from server');return}
  var srv={};
  (res.data||[]).forEach(function(r){var x={};if(r.in_time)x.in=r.in_time.slice(0,5);if(r.out_time)x.out=r.out_time.slice(0,5);if(x.in||x.out)srv[r.day]=x});
  for(var p in pend){if(S.days[p])srv[p]=S.days[p];else delete srv[p]}
  S.days=srv;cache();render();flush();allSaved();
 },function(){loading=false;sy('⚠ Offline — showing saved copy')});
}
function showApp(on){$('auth').style.display=on?'none':'block';$('main').style.display=on?'block':'none'}
function startUser(session){
 var id=session&&session.user?session.user.id:null;
 if(started&&id===uid)return;started=true;
 uid=id;busy={};
 if(!uid){S.days={};pend={};showApp(false);return}
 $('who').textContent='Signed in as '+(session.user.email||'');
 loadCache();showApp(true);render();pull();
}
function authMsg(t){$('aM').textContent=t}
function setupAuth(){
 if(!CONFIGURED){
  /* not connected to Supabase yet: work on this device only, for testing */
  uid=null;loadCache();showApp(true);$('who').textContent='';$('out').style.display='none';
  sy('⚠ Not connected — saved on this device only');render();return;
 }
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 sb.auth.getSession().then(function(r){startUser(r.data.session)});
 sb.auth.onAuthStateChange(function(ev,session){startUser(session)});
 $('aIn').onclick=function(){
  var em=$('aE').value.trim(),pw=$('aP').value;if(!em||!pw){authMsg('Enter your email and password.');return}
  authMsg('Signing in…');
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){authMsg(r.error?r.error.message:'')});
 };
 $('aUp').onclick=function(){
  var em=$('aE').value.trim(),pw=$('aP').value;if(!em||pw.length<6){authMsg('Enter an email and a password of at least 6 characters.');return}
  authMsg('Creating account…');
  sb.auth.signUp({email:em,password:pw}).then(function(r){
   if(r.error)authMsg(r.error.message);
   else if(!r.data.session)authMsg('Account created. Check your email to confirm, then sign in.');
   else authMsg('');
  });
 };
 $('out').onclick=function(){sb.auth.signOut()};
 document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
 window.addEventListener('online',function(){flush();pull()});
}

var HARI=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function pad(n){return(n<10?'0':'')+n}
function dm(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
var view=monday(new Date()),curDay=ds(new Date());
function tm(s){if(!s)return null;var p=s.split(':');return +p[0]*60+ +p[1]}
function dur(m){var a=Math.abs(Math.round(m));if(a===0)return '0 min';var s=m<0?'-':'+',h=Math.floor(a/60),n=a%60,p=[];if(h)p.push(h+' hr');if(n)p.push((h?pad(n):n)+' min');return s+p.join(' ')}
function fh(m){var a=Math.round(m),h=Math.floor(a/60),n=a%60;return h+' hr'+(n?' '+pad(n)+' min':'')}
function h12(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),n=m%60;return (h%12||12)+':'+pad(n)+' '+(h<12?'AM':'PM')}
function tc(k,f,v){return '<div class="tc'+(v?'':' e')+'">'+(v?h12(tm(v)):'--:--')+'<input type="time" data-k="'+k+'" data-f="'+f+'" value="'+(v||'')+'">'+(v?'<button type="button" class="x" data-k="'+k+'" data-f="'+f+'" aria-label="Reset time">×</button>':'')+'</div>'}
function cls(m){return m>0?'pos':(m<0?'neg':'')}
function weekCalc(mon){
 var tot=0,hrs=0,rec=null;
 for(var i=0;i<7;i++){
  var d=new Date(mon);d.setDate(mon.getDate()+i);var e=S.days[ds(d)]||{},a=tm(e.in),o=tm(e.out);
  if(i===4){if(a!==null)rec=a+STD-tot;continue}
  if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;hrs+=w;tot+=w-STD}
 }
 return {tot:tot,hrs:hrs,rec:rec};
}
function btnState(){
 var b=document.getElementById('bB');
 if(new Date().getDay()===5){var c=weekCalc(monday(new Date()));b.disabled=true;b.innerHTML=(c.rec!==null?'Leave at '+h12(c.rec):'Leave')+'<small>'+(c.rec!==null?'Suggested for Friday':'Arrive first to see the time')+'</small>'}
 else{b.disabled=false;b.textContent='Leave'}
}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dshort(d){return d.getDate()+' '+MON[d.getMonth()]}
/* compact balance for the day rows: +18m, -1h 05m */
function durS(m){var a=Math.abs(Math.round(m));if(a===0)return '0m';var h=Math.floor(a/60),n=a%60;return (m<0?'−':'+')+(h?h+'h '+pad(n)+'m':n+'m')}
function render(){
 var tb=document.getElementById('rows'),html='',td=ds(new Date()),c=weekCalc(view);
 for(var i=0;i<7;i++){
  var d=new Date(view);d.setDate(view.getDate()+i);var k=ds(d),e=S.days[k]||{};
  if(i>4&&!e.in&&!e.out&&k!==td)continue;
  var a=tm(e.in),o=tm(e.out),bal='—',bc=' e',lv,tg='';
  if(a!==null)tg='Target '+h12(a+STD);
  if(i===4){
   lv='<div class="tc rec'+(c.rec!==null?'':' e')+'">'+(c.rec!==null?h12(c.rec):'--:--')+'<em>Suggested</em></div>';
   if(a!==null)tg='Ends the week at 0';
  }else{
   lv=tc(k,'out',e.out);
   if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;var b=w-STD;bal=durS(b);bc=' '+cls(b)}
  }
  html+='<div class="day'+(k===td?' today':'')+'"><div class="dn"><b>'+HARI[i]+'</b><i>'+dshort(d)+'</i></div>'
  +'<div class="tm">'+tc(k,'in',e.in)+'<span aria-hidden="true">→</span>'+lv+'</div>'
  +'<div class="bl'+bc+'">'+bal+'</div>'
  +(tg?'<div class="tg">'+tg+'</div>':'')+'</div>';
 }
 tb.innerHTML=html;
 var t=document.getElementById('tot');t.textContent=dur(c.tot);t.className=cls(c.tot);
 document.getElementById('hrs').textContent=fh(c.hrs);
 var end=new Date(view);end.setDate(view.getDate()+4);
 document.getElementById('wk').textContent=view.getMonth()===end.getMonth()?view.getDate()+' – '+dshort(end):dshort(view)+' – '+dshort(end);
 var off=Math.round((view-monday(new Date()))/604800000);
 document.getElementById('wkL').textContent=off===0?'This week':off===-1?'Last week':off===1?'Next week':'';
 btnState();
}
function msg(t){var m=document.getElementById('msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(function(){m.textContent=''},6000)}
function mark(f){
 var n=new Date(),k=ds(n);S.days[k]=S.days[k]||{};
 view=monday(n);
 if(f==='out'&&n.getDay()===5){render();msg('No leave time needed on Friday. Follow the recommended time.');return}
 if(f==='in'&&S.days[k].in){render();msg('Already arrived at '+h12(tm(S.days[k].in))+'. Tap the time to edit.');return}
 S.days[k][f]=pad(n.getHours())+':'+pad(n.getMinutes());
 saveDay(k);render();
 var t=(f==='in'?'Arrival':'Leave')+' recorded: '+h12(tm(S.days[k][f]));
 if(f==='in'&&n.getDay()===5){var c=weekCalc(monday(n));if(c.rec!==null)t+=' · Recommended leave: '+h12(c.rec)}
 if(f==='out'&&!S.days[k].in)t+=' (no arrival yet, tap the Arrive cell to set it)';
 msg(t)
}
function tick(){var k=ds(new Date());if(k!==curDay){curDay=k;view=monday(new Date());render()}}
setInterval(tick,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
window.addEventListener('focus',tick);window.addEventListener('pageshow',tick);

document.getElementById('bS').onclick=function(){tick();mark('in')};
document.getElementById('bB').onclick=function(){tick();mark('out')};
document.getElementById('prev').onclick=function(){view.setDate(view.getDate()-7);render()};
document.getElementById('next').onclick=function(){view.setDate(view.getDate()+7);render()};
var rows=document.getElementById('rows');
rows.addEventListener('change',function(ev){
 var t=ev.target;if(!t.dataset||!t.dataset.k||t.tagName!=='INPUT')return;
 S.days[t.dataset.k]=S.days[t.dataset.k]||{};S.days[t.dataset.k][t.dataset.f]=t.value;saveDay(t.dataset.k);render();
});
rows.addEventListener('click',function(ev){
 var x=ev.target.closest?ev.target.closest('.x'):null;if(!x)return;
 ev.preventDefault();ev.stopPropagation();
 var k=x.dataset.k,f=x.dataset.f;
 if(S.days[k]){S.days[k][f]='';saveDay(k)}
 render();msg('Time reset to --:--');
});
setupAuth();
</script>
</body>
</html>
