<style>
/* Kala palette: Ink #1E2A3B, Amber #F5A524 (accent only), White */
:root{--bg:#141C28;--card:#1E2A3B;--card2:#2A3950;--tx:#F5F7FA;--mut:#A3B0C2;--line:#33445C;--ok:#4ADE80;--bad:#FF7A70;--amber:#F5A524;--ink:#1E2A3B;--hi:#F5A524;
--leaveBg:#F5F7FA;--leaveTx:#1E2A3B;--xBg:#3D4F69;--xTx:#D5DDE8;--shadow:none;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F5F8;--card:#FFFFFF;--card2:#EDF0F5;--tx:#1E2A3B;--mut:#5A6A80;--line:#E1E6ED;--ok:#15803D;--bad:#C81E1E;--hi:#9A5B00;
--leaveBg:#1E2A3B;--leaveTx:#FFFFFF;--xBg:#D5DCE6;--xTx:#1E2A3B;--shadow:0 1px 3px rgba(30,42,59,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;max-width:520px;margin:0 auto;padding:12px 16px 40px;touch-action:manipulation}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* Header: greeting + settings */
.hd{display:flex;align-items:flex-start;gap:8px;margin:10px 0 18px}
.hd>div{flex:1;min-width:0}
.hd h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.5px;line-height:1.15}
.hd small{display:block;color:var(--mut);font-size:15px;margin-top:4px}
#dt:not(:empty)+#syT:not(:empty)::before{content:" · "}
#gear{flex:none;width:44px;height:44px;margin:-4px -8px 0 0;border:0;border-radius:22px;background:none;color:var(--mut);display:grid;place-items:center}
#gear:active{background:var(--card)}
#gear svg{width:24px;height:24px}
/* Pull down to refresh: the Kala mark drops in and its amber minute hand turns */
#ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) - 56px);display:flex;justify-content:center;z-index:10;pointer-events:none;transform:translateY(0);opacity:0}
#ptr.back{transition:transform .25s ease,opacity .25s ease}
body.ptrback{transition:padding-top .25s ease}
#ptr svg{width:44px;height:44px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
#hM{transform-origin:118.16px 128px}
#ptr.spin #hM{animation:spinM .8s linear infinite}
@keyframes spinM{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.spin #hM{animation:none}}
/* Summary: the one big number */
.sum{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:20px 20px 18px;margin-bottom:12px}
.sum small{color:var(--mut);font-size:15px;font-weight:500;display:block}
.sum b{font-size:44px;font-weight:700;letter-spacing:-1px;display:block;margin:2px 0 6px;line-height:1.1}
.sum span{color:var(--mut);font-size:15px}
.sum span b{display:inline;font-size:15px;font-weight:600;color:var(--tx);letter-spacing:0;margin:0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* Arrive (amber) / Leave */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button{border:0;border-radius:16px;padding:0 6px;font-size:19px;font-weight:600;min-height:64px;transition:transform .1s,opacity .1s}
.btns button small{display:block;font-size:13px;font-weight:500;margin-top:2px}
#bS{background:var(--amber);color:var(--ink)}#bB{background:var(--leaveBg);color:var(--leaveTx)}
.btns button:active{transform:scale(.97);opacity:.85}
#bB:disabled{background:transparent;color:var(--tx);border:1.5px dashed var(--line);cursor:default;transform:none;opacity:1}
#bB:disabled small{color:var(--mut)}
#msg{min-height:18px;text-align:center;color:var(--mut);font-size:14px;margin:8px 0 4px}
/* Week switcher */
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.nav button{background:none;border:0;color:var(--hi);width:44px;height:44px;border-radius:22px;font-size:26px;line-height:1}
.nav button:active{background:var(--card)}
.nav div{text-align:center}
.nav b{display:block;font-size:17px;font-weight:600}
.nav small{display:block;color:var(--mut);font-size:13px;min-height:16px}
/* Day list */
.wrap{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:0 14px}
.day{display:grid;grid-template-columns:46px 1fr 72px;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dn{grid-row:1/3;line-height:1.15}
.dn b{display:block;font-size:17px;font-weight:600}
.dn i{display:block;font-style:normal;color:var(--mut);font-size:13px}
.day.today .dn b{color:var(--hi)}
.tm{display:flex;align-items:center;gap:6px}
.tm>span{color:var(--mut);font-size:13px;flex:none}
.tg{grid-column:2;color:var(--mut);font-size:13px;margin-top:5px;padding-left:2px}
.bl{grid-row:1/3;grid-column:3;text-align:right;font-weight:600;font-size:15px}
.bl.e{color:var(--mut);font-weight:400}
.tc{position:relative;flex:1;min-width:0;display:block;text-align:center;padding:9px 2px;background:var(--card2);border-radius:10px;font-size:15px;line-height:1.2;white-space:nowrap}
.tc.e{color:var(--mut)}
.tc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.tc.rec{background:transparent;border:1.5px dashed var(--amber);padding:3px 2px}
.tc.rec em{display:block;font-style:normal;font-size:11px;color:var(--hi);margin-top:1px}
.x{position:absolute;top:-12px;right:-12px;width:30px;height:30px;z-index:2;padding:0;border:0;background:transparent;font-size:0}
.x::after{content:"×";position:absolute;top:7px;right:7px;width:15px;height:15px;border-radius:50%;background:var(--xBg);color:var(--xTx);font-size:12px;line-height:15px;text-align:center}
/* Settings sheet */
#set{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);transform:translateY(100%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
#set.open{transform:none;visibility:visible;transition:transform .3s ease}
@media (prefers-reduced-motion:reduce){#set,#set.open{transition:none}}
#set .in{max-width:520px;margin:0 auto}
.shd{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:6px}
.shd h2{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0}
.shd button{border:0;background:none;color:var(--hi);font-size:17px;font-weight:600;min-height:44px;padding:0 4px}
.sec{margin-top:22px}
.sec h3{font-size:13px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px 16px}
.grp{background:var(--card);box-shadow:var(--shadow);border-radius:14px;overflow:hidden}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;font-size:15px;font-weight:500;color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:0 16px;border:0;background:none;text-align:left;font-size:17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .val{color:var(--mut);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.row:active{background:var(--card2)}
.row.chev .val::after{content:"  ›";color:var(--mut)}
.row.danger{color:var(--bad);justify-content:center;font-weight:500}
.imp{padding:14px 16px}
.imp p{color:var(--mut);font-size:14px;margin:0 0 10px}
.imp textarea{display:block;width:100%;min-height:90px;border:0;border-radius:12px;background:var(--card2);color:var(--tx);padding:10px 12px;font:16px/1.4 ui-monospace,Menlo,monospace}
.imp button{width:100%;margin:10px 0 0;border:0;border-radius:12px;min-height:46px;font-weight:600;background:var(--amber);color:var(--ink)}
#impM{min-height:18px;font-size:14px;color:var(--mut);padding-top:8px;text-align:center}
.ver{text-align:center;color:var(--mut);font-size:13px;margin-top:26px}
/* Sign in */
#auth{display:none;margin-top:8vh}
#auth .brand{display:block;width:190px;height:auto;margin:0 auto 10px;color:var(--tx)}
#auth .tagline{text-align:center;color:var(--mut);font-size:16px;margin:0 0 26px}
#auth .box{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:20px}
#auth h2{font-size:22px;margin:0 0 14px}
#auth input{display:block;width:100%;margin:0 0 10px;padding:13px 14px;border-radius:12px;border:0;background:var(--card2);color:var(--tx);font-size:17px}
#auth input::placeholder{color:var(--mut)}
#auth input:focus{outline:2px solid var(--hi);outline-offset:0}
#auth .ab{display:grid;gap:10px;margin-top:6px}
#auth button{border:0;border-radius:14px;min-height:50px;font-size:17px;font-weight:600;color:var(--ink);background:var(--amber)}
#auth button#aUp{background:none;color:var(--hi);min-height:44px}
#aM{color:var(--mut);font-size:14px;min-height:18px;margin-top:8px;text-align:center}
#auth #authLang{display:block;margin:18px auto 0;border:0;background:none;color:var(--mut);font-size:15px;font-weight:500;min-height:44px;padding:0 12px}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.btns button{transition:none}.btns button:active{transform:none}}
</style>

/* ===== Data ===== */
function ck(){return 'wh_'+(uid||'local')}
function cache(){try{localStorage.setItem(ck(),JSON.stringify({days:S.days,pend:pend}))}catch(e){}}
function loadCache(){S.days={};pend={};try{var o=JSON.parse(localStorage.getItem(ck())||'null');if(o){S.days=o.days||{};pend=o.pend||{}}}catch(e){}}
function allSaved(){if(!Object.keys(pend).length)sy('synced')}
function retry(){if(!retryT)retryT=setTimeout(function(){retryT=null;flush()},5000)}
/* One row per day: saving a day only ever touches that day,
   so an old tab or another phone can never wipe other days. */
function writeDay(k){
 if(!sb||!uid||busy[k])return;
 busy[k]=true;
 var ver=pend[k],e=S.days[k],q;
 if(e&&(e.in||e.out))q=sb.from('work_days').upsert({user_id:uid,day:k,in_time:e.in||null,out_time:e.out||null,updated_at:new Date().toISOString()},{onConflict:'user_id,day'});
 else q=sb.from('work_days').delete().eq('user_id',uid).eq('day',k);
 q.then(function(res){
  busy[k]=false;
  if(res.error){sy('retrying');retry();return}
  if(pend[k]===ver){delete pend[k];cache()}else if(pend[k]){writeDay(k);return}
  allSaved();
 },function(){busy[k]=false;sy('offlineSave');retry()});
}
function flush(){for(var k in pend)writeDay(k)}
function saveDay(k){
 var e=S.days[k];if(e){if(!e.in)delete e.in;if(!e.out)delete e.out;if(!e.in&&!e.out)delete S.days[k]}
 pend[k]=(pend[k]||0)+1;cache();
 if(sb&&uid)sy('saving');
 writeDay(k);
}
/* Fetch from the server every time the app is opened or comes back to the front */
var loading=false;
function pull(){
 if(!sb||!uid||loading)return;loading=true;
 sb.from('work_days').select('day,in_time,out_time').then(function(res){
  loading=false;
  if(res.error){sy('loadFail');return}
  var srv={};
  (res.data||[]).forEach(function(r){var x={};if(r.in_time)x.in=r.in_time.slice(0,5);if(r.out_time)x.out=r.out_time.slice(0,5);if(x.in||x.out)srv[r.day]=x});
  for(var p in pend){if(S.days[p])srv[p]=S.days[p];else delete srv[p]}
  S.days=srv;cache();render();flush();allSaved();
 },function(){loading=false;sy('offlineCopy')});
}

 if(!n&&u&&u.email){n=u.email.split('@')[0].split(/[._\-+0-9]/)[0]||'';n=n.charAt(0).toUpperCase()+n.slice(1)}
 return n;

 if(started&&id===uid)return;started=true;
 uid=id;busy={};
 if(!uid){S.days={};pend={};myName='';myEmail='';try{localStorage.removeItem('wh_last')}catch(e){}acct();showApp(false);return}

/* Open straight to the saved copy while the server confirms the sign-in,

function quickStart(){

  var last=JSON.parse(localStorage.getItem('wh_last')||'null'),has=false;

  if(!last||!has)return;
  uid=last.id;myName=last.name||'';myEmail=last.email||'';acct();
  loadCache();showApp(true);render();sy('syncing');
 }catch(e){}
}
function authMsg(k){$('aM').textContent=k}
function setupAuth(){
 if(!CONFIGURED){
  /* not connected to Supabase yet: work on this device only, for testing */

 sb.auth.getSession().then(function(r){
  /* no signal on open: keep showing the saved copy instead of the sign-in screen */
  if(!r.data.session&&r.error&&uid&&(navigator.onLine===false||/fetch|network/i.test(r.error.message||''))){sy('offlineCopy');return}
  startUser(r.data.session)},function(){if(!uid)showApp(false)});
 sb.auth.onAuthStateChange(function(ev,session){startUser(session)});
 $('aIn').onclick=function(){

 };

  var em=$('aE').value.trim(),pw=$('aP').value;if(!em||pw.length<6){authMsg(t('needPw6'));return}

/* ===== Week view ===== */
function pad(n){return(n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
var view=monday(new Date()),curDay=ds(new Date());
function tm(s){if(!s)return null;var p=s.split(':');return +p[0]*60+ +p[1]}
function dur(m){var a=Math.abs(Math.round(m));if(a===0)return '0 '+t('min');var s=m<0?'−':'+',h=Math.floor(a/60),n=a%60,p=[];if(h)p.push(h+' '+t('hr'));if(n)p.push((h?pad(n):n)+' '+t('min'));return s+p.join(' ')}
function fh(m){var a=Math.round(m),h=Math.floor(a/60),n=a%60;return h+' '+t('hr')+(n?' '+pad(n)+' '+t('min'):'')}
function h12(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),n=m%60;return (h%12||12)+':'+pad(n)+' '+(h<12?'AM':'PM')}
function tc(k,f,v){return '<div class="tc'+(v?'':' e')+'">'+(v?h12(tm(v)):'--:--')+'<input type="time" data-k="'+k+'" data-f="'+f+'" value="'+(v||'')+'">'+(v?'<button type="button" class="x" data-k="'+k+'" data-f="'+f+'" aria-label="'+t('resetTime')+'">×</button>':'')+'</div>'}
function cls(m){return m>0?'pos':(m<0?'neg':'')}
function weekCalc(mon){
 var tot=0,hrs=0,rec=null;
 for(var i=0;i<7;i++){
  var d=new Date(mon);d.setDate(mon.getDate()+i);var e=S.days[ds(d)]||{},a=tm(e.in),o=tm(e.out);
  if(i===4){if(a!==null)rec=a+STD-tot;continue}
  if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;hrs+=w;tot+=w-STD}
 }
 return {tot:tot,hrs:hrs,rec:rec};
}
function btnState(){
 $('bS').textContent=t('arrive');
 var b=$('bB');
 if(new Date().getDay()===5){var c=weekCalc(monday(new Date()));b.disabled=true;b.innerHTML=(c.rec!==null?t('leaveAt')+' '+h12(c.rec):t('leave'))+'<small>'+(c.rec!==null?t('sugFri'):t('arriveFirst'))+'</small>'}
 else{b.disabled=false;b.textContent=t('leave')}
}
function dshort(d){return d.getDate()+' '+t('months')[d.getMonth()]}
/* compact balance for the day rows: +18m, -1h 05m */
function durS(m){var a=Math.abs(Math.round(m));if(a===0)return '0'+t('m');var h=Math.floor(a/60),n=a%60;return (m<0?'−':'+')+(h?h+t('h')+' '+pad(n)+t('m'):n+t('m'))}
function render(){
 if(typeof editingTime==='function'&&editingTime()){redrawLater=true;return}
 var tb=$('rows'),html='',td=ds(new Date()),c=weekCalc(view),DAYS=t('days');
 for(var i=0;i<7;i++){
  var d=new Date(view);d.setDate(view.getDate()+i);var k=ds(d),e=S.days[k]||{};
  if(i>4&&!e.in&&!e.out&&k!==td)continue;
  var a=tm(e.in),o=tm(e.out),bal='—',bc=' e',lv,tg='';
  if(a!==null)tg=t('target')+' '+h12(a+STD);
  if(i===4){
   lv='<div class="tc rec'+(c.rec!==null?'':' e')+'">'+(c.rec!==null?h12(c.rec):'--:--')+'<em>'+t('suggested')+'</em></div>';
   if(a!==null)tg=t('endsWeek');
  }else{
   lv=tc(k,'out',e.out);
   if(a!==null&&o!==null){var w=o-a;if(w<0)w+=1440;var b=w-STD;bal=durS(b);bc=' '+cls(b)}
  }
  html+='<div class="day'+(k===td?' today':'')+'"><div class="dn"><b>'+DAYS[i]+'</b><i>'+dshort(d)+'</i></div>'
  +'<div class="tm">'+tc(k,'in',e.in)+'<span aria-hidden="true">→</span>'+lv+'</div>'
  +'<div class="bl'+bc+'">'+bal+'</div>'
  +(tg?'<div class="tg">'+tg+'</div>':'')+'</div>';
 }
 tb.innerHTML=html;
 var tt=$('tot');tt.textContent=dur(c.tot);tt.className=cls(c.tot);
 $('hrs').textContent=fh(c.hrs);
 var end=new Date(view);end.setDate(view.getDate()+4);
 $('wk').textContent=view.getMonth()===end.getMonth()?view.getDate()+' – '+dshort(end):dshort(view)+' – '+dshort(end);
 var off=Math.round((view-monday(new Date()))/604800000);
 $('wkL').textContent=off===0?t('thisWeek'):off===-1?t('lastWeek'):off===1?t('nextWeek'):'';
 btnState();
}
function msg(s){var m=$('msg');m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(function(){m.textContent=''},6000)}
function mark(f){
 var n=new Date(),k=ds(n);S.days[k]=S.days[k]||{};
 view=monday(n);
 if(f==='out'&&n.getDay()===5){render();msg(t('noLeaveFri'));return}
 if(f==='in'&&S.days[k].in){render();msg(t('already',{t:h12(tm(S.days[k].in))}));return}
 S.days[k][f]=pad(n.getHours())+':'+pad(n.getMinutes());
 saveDay(k);render();
 var s=t(f==='in'?'arrivalRec':'leaveRec',{t:h12(tm(S.days[k][f]))});
 if(f==='in'&&n.getDay()===5){var c=weekCalc(monday(n));if(c.rec!==null)s+=t('sugLeave',{t:h12(c.rec)})}
 if(f==='out'&&!S.days[k].in)s+=t('noArrival');
 msg(s)
}
function tick(){var k=ds(new Date());if(k!==curDay){curDay=k;view=monday(new Date());render();greet()}}
setInterval(tick,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
window.addEventListener('focus',tick);window.addEventListener('pageshow',tick);

$('bS').onclick=function(){tick();mark('in')};
$('bB').onclick=function(){tick();mark('out')};
$('prev').onclick=function(){view.setDate(view.getDate()-7);render()};
$('next').onclick=function(){view.setDate(view.getDate()+7);render()};
var rows=$('rows');
/* iPhone time wheel: it can report an empty value while the wheel is still spinning,
   and redrawing the list while the picker is open cuts the picker off. So: ignore empty
   values (clearing is done with the × button) and redraw only once the picker closes. */
var redrawLater=false;
function editingTime(){var a=document.activeElement;return a&&a.tagName==='INPUT'&&a.type==='time'&&typeof rows!=='undefined'&&rows.contains(a)}
rows.addEventListener('change',function(ev){
 var x=ev.target;if(!x.dataset||!x.dataset.k||x.tagName!=='INPUT')return;
 if(!/^\d{1,2}:\d{2}/.test(x.value||''))return;
 var k=x.dataset.k,v=x.value.slice(0,5);
 S.days[k]=S.days[k]||{};if(S.days[k][x.dataset.f]===v)return;
 S.days[k][x.dataset.f]=v;saveDay(k);
 var lab=x.parentNode.firstChild;if(lab&&lab.nodeType===3)lab.nodeValue=h12(tm(v));x.parentNode.classList.remove('e');
 if(editingTime())redrawLater=true;else render();
});
function flushRedraw(){if(redrawLater&&!editingTime()){redrawLater=false;render()}}/* redraw once the picker has closed: on blur, on the next tap anywhere, or when the app comes back */document.addEventListener('focusout',function(){setTimeout(flushRedraw,60)},true);document.addEventListener('touchstart',function(){setTimeout(flushRedraw,60)},{passive:true});document.addEventListener('click',function(){setTimeout(flushRedraw,60)});document.addEventListener('visibilitychange',function(){setTimeout(flushRedraw,60)});setInterval(flushRedraw,1500);
rows.addEventListener('click',function(ev){
 var x=ev.target.closest?ev.target.closest('.x'):null;if(!x)return;
 ev.preventDefault();ev.stopPropagation();
 var k=x.dataset.k,f=x.dataset.f;
 if(S.days[k]){S.days[k][f]='';saveDay(k)}
 render();msg(t('resetDone'));
});

/* ===== Pull down to refresh (Home Screen apps have no reload button) ===== */
var ptr=$('ptr'),hM=$('hM'),y0=null,pd=0,busyR=false,TRIG=70;
function ptrSet(d){document.body.style.paddingTop=(12+d)+'px';ptr.style.transform='translateY('+d+'px)';ptr.style.opacity=Math.min(1,d/40);hM.style.transform='rotate('+(d*5)+'deg)'}
function hardReload(){location.replace(location.pathname+'?r='+Date.now())}
document.addEventListener('touchstart',function(e){
 if(busyR||window.scrollY>0||e.touches.length!==1||setEl.classList.contains('open')||(e.target.closest&&e.target.closest('#auth')))return;
 y0=e.touches[0].clientY;pd=0;ptr.classList.remove('back');document.body.classList.remove('ptrback');
},{passive:true});
document.addEventListener('touchmove',function(e){
 if(y0===null)return;
 var d=e.touches[0].clientY-y0;
 if(d<=0||window.scrollY>0){if(pd){pd=0;ptrSet(0)}return}
 pd=Math.min(110,d*.55);ptrSet(pd);
 if(e.cancelable)e.preventDefault();
},{passive:false});
document.addEventListener('touchend',function(){
 if(y0===null)return;y0=null;
 ptr.classList.add('back');document.body.classList.add('ptrback');
 if(pd>=TRIG){
  busyR=true;ptrSet(TRIG);ptr.classList.add('spin');
  if(navigator.vibrate)navigator.vibrate(10);
  /* reload fresh from the server: picks up the latest app version and latest times */
  setTimeout(function(){if(navigator.onLine===false){busyR=false;ptr.classList.remove('spin');ptrSet(0);sy('offlineCopy')}else hardReload()},450);
 }else ptrSet(0);
 pd=0;
});
/* Drop the ?r= added by a refresh so the address stays clean */
if(/[?&]r=\d+/.test(location.search)&&history.replaceState)history.replaceState(null,'',location.pathname);

/* ===== Automatic update: reload when a newer version is published ===== */
var APPV='20261127174015';
function checkUpdate(){
 if(!/^\d+$/.test(APPV)||!window.fetch)return;
 fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(x){
  var m=x.match(/var APPV='(\d+)'/);
  if(m&&m[1]>APPV&&!Object.keys(pend).length)hardReload();
 }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){greet();checkUpdate()}});
setTimeout(checkUpdate,3000);

/* ===== Import from the old Work Hours app (Netlify / artifact) ===== */
function importData(txt){
 var o;try{o=JSON.parse(txt)}catch(e){return t('badData')}
 var d=(o&&o.days)||o;if(!d||typeof d!=='object')return t('noDays');
 var n=0,re=/^([01]?\d|2[0-3]):[0-5]\d$/;
 for(var k in d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
  var v=d[k]||{},x=S.days[k]||{},ch=false;
  if(re.test(v.in||'')&&!x.in){x.in=v.in.length===4?'0'+v.in:v.in;ch=true}
  if(re.test(v.out||'')&&!x.out){x.out=v.out.length===4?'0'+v.out:v.out;ch=true}
  if(ch){S.days[k]=x;saveDay(k);n++}
 }
 render();
 return n?t('imported',{n:n}):t('nothingNew');
}
$('impB').onclick=function(){var v=$('impT').value.trim();if(!v){$('impM').textContent=t('pasteFirst');return}$('impM').textContent=importData(v);$('impT').value=''};
